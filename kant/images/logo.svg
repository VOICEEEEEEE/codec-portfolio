<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 70" fill="none">
  <!-- Stylized Barber Silhouette Icon -->
  <g transform="translate(10, 5)">
    <!-- Circle border -->
    <circle cx="30" cy="30" r="28" stroke="url(#goldGrad)" stroke-width="2" fill="#1f1610"/>
    <!-- Head profile silhouette with beard -->
    <path d="M22 17 C26 13, 36 13, 40 18 C44 23, 43 27, 43 29 C40 28, 35 28, 31 31 C29 32, 28 35, 27 38 C28 40, 31 41, 35 41 C37 41, 40 43, 38 46 C35 50, 27 50, 24 45 C22 41, 21 34, 21 28 Z" fill="url(#goldGrad)"/>
    <!-- Beard trim contour -->
    <path d="M32 37 C34 38, 37 38, 39 36 C41 38, 41 42, 38 44 C35 46, 32 45, 30 42 Z" fill="#1f1610" opacity="0.4"/>
    <!-- Scissor accent / detail -->
    <circle cx="21" cy="45" r="1.5" fill="url(#goldGrad)"/>
  </g>
  <!-- Text Brand -->
  <g transform="translate(80, 0)">
    <text x="0" y="36" font-family="'Cinzel', 'Playfair Display', 'Georgia', serif" font-size="28" font-weight="700" letter-spacing="4" fill="url(#goldGrad)">KANT</text>
    <text x="2" y="52" font-family="'Montserrat', 'Inter', sans-serif" font-size="11" font-weight="600" letter-spacing="6" fill="#e8ded4">BARBER'S</text>
  </g>
  <defs>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5d59e"/>
      <stop offset="50%" stop-color="#d4a373"/>
      <stop offset="100%" stop-color="#aa7942"/>
    </linearGradient>
  </defs>
</svg>
